<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1116">
<title>Urbe v0.20 QA</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b1116;color:#eef5f8;font:16px system-ui,sans-serif}body{display:grid;place-items:center}pre{white-space:pre-wrap;padding:16px}</style>
</head>
<body>
<div id="status">Carregando Urbe…</div>
<script>
(async()=>{
  const names=['p00.txt','p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt','p08.txt'];
  const parts=[];
  for(let i=0;i<names.length;i++){
    const el=document.getElementById('status');
    if(el) el.textContent=`Carregando Urbe… ${i+1}/${names.length}`;
    const r=await fetch('./payload/'+names[i]+'?qa=3',{cache:'no-store'});
    if(!r.ok) throw new Error(`${names[i]}: HTTP ${r.status}`);
    const t=(await r.text()).replace(/\s/g,'');
    if(t.includes('ELLIPSIZATION')) throw new Error(`${names[i]} foi truncado no deploy`);
    parts.push(t);
  }
  const b64=parts.join('');
  if(b64.length!==105836) throw new Error(`payload incompleto: ${b64.length}/105836`);
  if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)) throw new Error('payload contém caracteres inválidos');
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<pre>Falha ao carregar Urbe: '+String(e)+'</pre>'});
</script>
</body>
</html>
